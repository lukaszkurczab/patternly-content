name: Content publishing architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - name: Build all canonical content tracks
        env:
          CONTENT_BUILD_OUTPUT: ${{ runner.temp }}/content-build
        run: npm run content:build-all -- --root . --output-root "$CONTENT_BUILD_OUTPUT"
      - name: Score canonical answers for every catalog track
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { spawnSync } from "node:child_process"; const { tracks } = JSON.parse(readFileSync("content/catalog.json", "utf8")); for (const { trackId } of tracks) { const result = spawnSync("npm", ["run", "content:test", "--", "--track", trackId, "--root", "."], { stdio: "inherit" }); if (result.error) throw result.error; if (result.status !== 0) process.exit(result.status ?? 1); }'
      - run: npm run generate:candidate-readiness
      - run: git diff --exit-code -- evidence/readiness/candidate-readiness.json
      - run: npm run generate:review-packets
      - run: git diff --exit-code -- evidence/review-packets
      - name: Validate bundled Free nodes
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { validateBundledFreeNode } from "./scripts/product/bundled-free-node.mjs"; const configuration = JSON.parse(await readFile("config/bundled-free-node-packages.json", "utf8")); for (const entry of configuration.packages) await validateBundledFreeNode({ bundledFreeNodePath: `artifacts/bundled-free-nodes/${entry.trackId}/${entry.packageVersion}/package.json` });'
      - run: node scripts/publishing/ci-release-gate.mjs
