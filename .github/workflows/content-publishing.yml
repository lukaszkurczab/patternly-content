name: Content publishing architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patternly-content
    steps:
      - uses: actions/checkout@v4
        with:
          path: patternly-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read admitted application commit
        id: admitted-app
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const admission = JSON.parse(await readFile("evidence/admissions/candidate-admission-v3.json", "utf8"));
          const frontendCommit = admission.application?.frontendCommit;
          if (typeof frontendCommit !== "string" || !/^[a-f0-9]{40}$/u.test(frontendCommit)) {
            throw new Error("Candidate admission application commit is missing or malformed.");
          }
          if (!process.env.GITHUB_OUTPUT) throw new Error("GitHub Actions output file is unavailable.");
          await appendFile(process.env.GITHUB_OUTPUT, `frontend_commit=${frontendCommit}\n`, "utf8");
          NODE
      - uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/gcp-ace-trainer
          ref: ${{ steps.admitted-app.outputs.frontend_commit }}
          path: patternly
          fetch-depth: 0
      - name: Install admitted application dependencies
        run: npm ci
        working-directory: patternly
      - run: npm ci
      - run: npm test
      - name: Build all canonical content tracks
        env:
          CONTENT_BUILD_OUTPUT: ${{ runner.temp }}/content-build
        run: npm run content:build-all -- --root . --output-root "$CONTENT_BUILD_OUTPUT"
      - name: Score canonical answers for every catalog track
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { spawnSync } from "node:child_process"; const { tracks } = JSON.parse(readFileSync("content/catalog.json", "utf8")); for (const { trackId } of tracks) { const result = spawnSync("npm", ["run", "content:test", "--", "--track", trackId, "--root", "."], { stdio: "inherit" }); if (result.error) throw result.error; if (result.status !== 0) process.exit(result.status ?? 1); }'
      - name: Build source candidate in quarantine without granting admission
        env:
          CONTENT_CANDIDATE_OUTPUT: ${{ runner.temp }}/patternly-candidate-${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import { buildCandidateDraft } from "./scripts/review/candidate-draft-v2.mjs";

          const checkoutCommit = execFileSync("git", ["rev-parse", "HEAD"], { encoding: "utf8" }).trim();
          if (!/^[a-f0-9]{40}$/u.test(process.env.GITHUB_SHA ?? "") || checkoutCommit !== process.env.GITHUB_SHA) {
            throw new Error("Workflow checkout does not match the triggering commit.");
          }
          const outputDirectory = process.env.CONTENT_CANDIDATE_OUTPUT;
          if (!outputDirectory) throw new Error("Quarantined candidate output path is unavailable.");
          const { manifest } = await buildCandidateDraft({ outputDirectory });
          const notGranted = { candidateApproval: "not_granted", publishingAdmission: "not_granted", runtimeAdmission: "not_granted", appReleaseLockUpdated: false };
          if (manifest.status !== "draft_not_admitted" || JSON.stringify(manifest.review) !== JSON.stringify(notGranted) || manifest.tracks.length !== 9) {
            throw new Error("Quarantined source candidate has an invalid identity, scope, or admission boundary.");
          }
          process.stdout.write(`SOURCE_DRAFT_VALID candidateId=${manifest.candidateId}; checkoutCommit=${checkoutCommit}; contentSourceCommit=${manifest.release.sourceRepositoryCommit}; tracks=${manifest.tracks.length}; admission=not_granted\n`);
          NODE
      - name: Verify historical candidate decision and readiness without rewriting them
        run: |
          node --input-type=module <<'NODE'
          import { verifyCandidateReleaseEvidence } from "./scripts/review/candidate-release-gate-v2.mjs";

          const { candidate, readiness } = await verifyCandidateReleaseEvidence();
          if (readiness.candidateApproval.status !== "approved" || readiness.publishingAdmission !== "not_granted" || readiness.runtimeAdmission !== "not_granted" || readiness.appReleaseLockUpdated !== false) {
            throw new Error("Historical candidate evidence has an invalid identity or boundary.");
          }
          process.stdout.write(`HISTORICAL_EVIDENCE_VALID candidateId=${candidate.candidateId}; publishing/runtime=not_granted\n`);
          NODE
      - name: Require committed historical candidate and decision-bound readiness evidence to remain unchanged
        run: |
          git diff --exit-code -- reports/candidate-reconciliation/AWS-02-DRAFT evidence/candidate-decisions/current-candidate-decision-v2.json evidence/readiness/current-candidate-readiness-v2.json
          if test -n "$(git ls-files --others --exclude-standard -- reports/candidate-reconciliation/AWS-02-DRAFT evidence/candidate-decisions/current-candidate-decision-v2.json evidence/readiness/current-candidate-readiness-v2.json)"; then
            echo "Candidate or readiness evidence contains untracked files."
            exit 1
          fi
      - name: Validate configured bundled Free-node packages
        run: npm run validate:bundled-free-nodes
