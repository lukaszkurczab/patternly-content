name: Content publishing architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run authoring:validate
      - run: npm run audit:aws-workbook-source
      - run: npm run audit:gcp:authoring
      - run: npm run audit:ai901
      - run: npm run validate:backend-system-design
      - run: npm run validate:frontend-bank
      - run: npm run validate:object-oriented-design
      - run: npm run generate:eight-track-launch-readiness
      - run: git diff --exit-code -- evidence/readiness/eight-track-launch-readiness.json
      - run: npm run generate:review-packets
      - run: git diff --exit-code -- evidence/review-packets
      - name: Validate bundled Free nodes
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; import { validateBundledFreeNode } from "./scripts/product/bundled-free-node.mjs"; const configuration = JSON.parse(await readFile("config/bundled-free-node-packages.json", "utf8")); for (const entry of configuration.packages) await validateBundledFreeNode({ bundledFreeNodePath: `artifacts/bundled-free-nodes/${entry.trackId}/${entry.packageVersion}/package.json` });'
      - run: node scripts/publishing/ci-release-gate.mjs
