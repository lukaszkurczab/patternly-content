name: Real content release gate

on:
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Coding Interview validate hard gate
        run: npm run validate:real:coding-interview
      - name: Certification validate hard gate
        run: npm run validate:real:gcp-ace
      - name: Build isolated release candidate
        run: node scripts/publishing/ci-release-gate.mjs
