name: Content publishing architecture

on:
  push:
  pull_request:

jobs:
  architecture:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: patternly-content
    steps:
      - uses: actions/checkout@v4
        with:
          path: patternly-content
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read admitted application commit
        id: admitted-app
        run: |
          node --input-type=module <<'NODE'
          import { appendFile, readFile } from "node:fs/promises";

          const admission = JSON.parse(await readFile("evidence/admissions/candidate-admission-v3.json", "utf8"));
          const frontendCommit = admission.application?.frontendCommit;
          if (typeof frontendCommit !== "string" || !/^[a-f0-9]{40}$/u.test(frontendCommit)) {
            throw new Error("Candidate admission application commit is missing or malformed.");
          }
          if (!process.env.GITHUB_OUTPUT) throw new Error("GitHub Actions output file is unavailable.");
          await appendFile(process.env.GITHUB_OUTPUT, `frontend_commit=${frontendCommit}\n`, "utf8");
          NODE
      - uses: actions/checkout@v4
        with:
          repository: lukaszkurczab/gcp-ace-trainer
          ref: ${{ steps.admitted-app.outputs.frontend_commit }}
          path: patternly
          fetch-depth: 0
      - name: Install admitted application dependencies
        run: npm ci
        working-directory: patternly
      - run: npm ci
      - run: npm test
      - name: Build all canonical content tracks
        env:
          CONTENT_BUILD_OUTPUT: ${{ runner.temp }}/content-build
        run: npm run content:build-all -- --root . --output-root "$CONTENT_BUILD_OUTPUT"
      - name: Score canonical answers for every catalog track
        run: |
          node --input-type=module -e 'import { readFileSync } from "node:fs"; import { spawnSync } from "node:child_process"; const { tracks } = JSON.parse(readFileSync("content/catalog.json", "utf8")); for (const { trackId } of tracks) { const result = spawnSync("npm", ["run", "content:test", "--", "--track", trackId, "--root", "."], { stdio: "inherit" }); if (result.error) throw result.error; if (result.status !== 0) process.exit(result.status ?? 1); }'
      - name: Rebuild exact candidate draft
        run: npm run candidate:draft-v2
      - name: Regenerate readiness from the delegated decision
        run: npm run candidate:readiness-v2
      - name: Require committed candidate and decision-bound readiness evidence
        run: |
          git diff --exit-code -- reports/candidate-reconciliation/AWS-02-DRAFT evidence/readiness/bizq-02-candidate-readiness-v2.json
          if test -n "$(git ls-files --others --exclude-standard -- reports/candidate-reconciliation/AWS-02-DRAFT evidence/readiness/bizq-02-candidate-readiness-v2.json)"; then
            echo "Candidate or readiness evidence contains untracked files."
            exit 1
          fi
      - name: Validate configured bundled Free-node packages
        run: npm run validate:bundled-free-nodes
