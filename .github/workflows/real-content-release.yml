name: Real content release gate

on:
  workflow_dispatch:

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run verify:migration
      - name: Rebuild exact candidate draft
        run: npm run candidate:draft-v2
      - name: Regenerate readiness from the delegated decision
        run: npm run candidate:readiness-v2
      - name: Require committed candidate and decision-bound readiness evidence
        run: |
          git diff --exit-code -- reports/candidate-reconciliation/AWS-02-DRAFT evidence/readiness/candidate-readiness-v2.json
          if test -n "$(git ls-files --others --exclude-standard -- reports/candidate-reconciliation/AWS-02-DRAFT evidence/readiness/candidate-readiness-v2.json)"; then
            echo "Candidate or readiness evidence contains untracked files."
            exit 1
          fi
      - name: Stop until publishing and runtime admission are granted
        run: npm run candidate:release-gate-v2
