<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title desc">
  <title id="title">Sequential scans add, nested scans multiply</title>
  <desc id="desc">Two separate rows each contain n work units, while a nested grid contains n rows of n work units.</desc>
  <rect width="720" height="360" fill="#101827" rx="24"/>
  <text x="44" y="52" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="26" font-weight="700">Count repeated work, not loop keywords</text>
  <text x="44" y="92" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="20" font-weight="700">Sequential scans: n + n = 2n → Θ(n)</text>
  <g fill="#5EEAD4">
    <rect x="44" y="116" width="48" height="28" rx="6"/><rect x="100" y="116" width="48" height="28" rx="6"/><rect x="156" y="116" width="48" height="28" rx="6"/><rect x="212" y="116" width="48" height="28" rx="6"/>
    <rect x="44" y="154" width="48" height="28" rx="6"/><rect x="100" y="154" width="48" height="28" rx="6"/><rect x="156" y="154" width="48" height="28" rx="6"/><rect x="212" y="154" width="48" height="28" rx="6"/>
  </g>
  <text x="282" y="143" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">two passes, added</text>
  <text x="44" y="228" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="20" font-weight="700">Nested scans: n × n → Θ(n²)</text>
  <g fill="#FCA5A5">
    <rect x="44" y="246" width="28" height="22" rx="4"/><rect x="78" y="246" width="28" height="22" rx="4"/><rect x="112" y="246" width="28" height="22" rx="4"/><rect x="146" y="246" width="28" height="22" rx="4"/>
    <rect x="44" y="274" width="28" height="22" rx="4"/><rect x="78" y="274" width="28" height="22" rx="4"/><rect x="112" y="274" width="28" height="22" rx="4"/><rect x="146" y="274" width="28" height="22" rx="4"/>
    <rect x="44" y="302" width="28" height="22" rx="4"/><rect x="78" y="302" width="28" height="22" rx="4"/><rect x="112" y="302" width="28" height="22" rx="4"/><rect x="146" y="302" width="28" height="22" rx="4"/>
  </g>
  <text x="198" y="283" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">each outer pass repeats the inner work</text>
</svg>
